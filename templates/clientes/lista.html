{% extends 'base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between mb-3">
  <h2>Clientes</h2>
  <a href="{% url 'clientes:novo' %}" class="btn btn-primary">+ Novo cliente</a>
</div>

<table class="table table-striped table-hover bg-white">
  <thead class="table-dark">
    <tr>
      <th>Nome</th>
      <th>CPF</th>
      <th>Telefone</th>
      <th>E-mail</th>
    </tr>
  </thead>
  <tbody>
    {% for cliente in clientes %}
    <tr>
      <td>{{ cliente.nome }}</td>
      <td>{{ cliente.cpf }}</td>
      <td>{{ cliente.telefone }}</td>
      <td>{{ cliente.email }}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="4" class="text-center">Nenhum cliente cadastrado.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
